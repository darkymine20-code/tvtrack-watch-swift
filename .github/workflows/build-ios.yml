name: Build & Test TVTrackWatch iPadOS (Swift)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Verify Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Build Xcode iOS App Target
        run: |
          xcodebuild build \
            -project TVTrackWatch.xcodeproj \
            -scheme TVTrackWatch \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            -derivedDataPath ./build

      - name: Create Signable IPA Package
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TVTrackWatch.app Payload/
          zip -r TVTrackWatch-iPadOS.ipa Payload

      - name: Upload Signable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVTrackWatch-iPadOS.ipa
          path: TVTrackWatch-iPadOS.ipa
          if-no-files-found: error
