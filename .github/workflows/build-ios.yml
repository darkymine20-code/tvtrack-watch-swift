name: Build & Test TVTrackWatch iPadOS (Swift)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true

      - name: Verify Swift & Xcode Version
        run: |
          swift --version
          xcodebuild -version

      - name: Swift Build (iPadOS Target)
        run: swift build -v

      - name: Run Unit Tests
        run: swift test -v
